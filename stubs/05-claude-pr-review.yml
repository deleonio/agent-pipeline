name: 5/7 Review

# ⚠️ VERTRAG: Dateiname + name sind load-bearing (Allowlist '5/7 Review' in gate-merge
# UND in 05s jq-Filter, Sweep-Dispatch, pr-cancel iteriert Dateinamen) — NICHT umbenennen.
# generated by agent-pipeline@v1.0 — Änderungen nur via init.sh / Re-Pin, nicht von Hand.

# Reviewt einen Pull Request im Kreuzverhör, sobald er das Label
# "ai:needs-review" trägt.
# Setzt **Claude Code** ein; Provider via `vars.LLM_PROVIDER` (zai|claude), aufgelöst in setup-claude.
#   - Findings → ai:needs-changes (→ Fixup)
#   - Entscheidungs-Findings ("Mensch entscheidet") → ai:needs-human (→ wartet auf Mensch)
#   - sauber 🟢 → ai:ready-to-merge (→ Gate)
# Ändert KEINEN Code.
#
# CONCURRENCY: Statische Gruppe pro Phase (globale Serialisierung, FIFO). Der `precheck`-Job
# (im Callee) prüft den LABEL-IST-ZUSTAND zur LAUFZEIT — queued Runs würden mit dem Label-
# Zustand zum TRIGGER-Zeitpunkt falsch wiederholen. Der frühere Supersede-Effekt
# (cancel-in-progress: true verdrängte den laufenden Review bei Neu-Triggern) wird durch den
# Autolabeler kompensiert (pr-needs-review-label.yml cancelt bei menschlichem Push zuerst
# alte 05/06-Runs des Branches).

on:
  pull_request:
    types: [labeled]

concurrency:
  group: claude-pr-review
  cancel-in-progress: false
  # queue: max — OHNE dies hält GitHub pro Gruppe nur EINEN pending-Run: jeder neue
  # Run cancelt den wartenden (`queue: single` ist der Default). Mit statischem,
  # ticket-unabhängigem Key hätte ein Label-Burst über mehrere Tickets die
  # wartenden Läufe still verworfen — Trigger-Label klebt, kein Lauf, kein Notice.
  # `max` = bis zu 100 pending, FIFO. Unvereinbar mit cancel-in-progress: true.
  queue: max

permissions:
  contents: read
  id-token: write
  actions: write
  pull-requests: write
  issues: write

jobs:
  review:
    # Unveränderliche Event-Fakten filtern hier — inkl. des FORK-GUARDS. Der ist an dieser
    # Stelle sicherheitsrelevant: der Callee checkt bei pull_request den Merge-Ref, also
    # PR-Code, aus und führt Actions/Skripte daraus aus. Stünde der Guard erst am Callee-
    # Hauptjob, führte ein Fork-PR mit manipuliertem check-phase-label.sh eigenen Bash aus,
    # sobald irgendjemand ein Label setzt. Vor dieser Umstellung gab es für Fork-PRs gar
    # keinen Checkout in 04.
    if: >-
      ${{ github.event.label.name == 'ai:needs-review' &&
      github.event.pull_request.head.repo.full_name == github.repository }}
    uses: deleonio/agent-pipeline/.github/workflows/review.yml@v1.0
    with:
      pr-number: ${{ github.event.pull_request.number }}
      ci-workflow-name: 'CI'
    secrets:
      APP_ID: ${{ secrets.APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
      ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
      CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
