name: 6/7 Fixup

# ⚠️ VERTRAG: Dateiname + name sind load-bearing (Phasen-Verkettung/Doku der Pipeline,
# pr-cancel iteriert Dateinamen) — NICHT umbenennen.
# generated by agent-pipeline@v1.0 — Änderungen nur via init.sh / Re-Pin, nicht von Hand.

# Reagiert auf das Label "ai:needs-changes" (vom Review gesetzt) und setzt die
# zutreffenden Findings um.
# Setzt **Claude Code** ein; Provider via `vars.LLM_PROVIDER` (zai|claude), aufgelöst in setup-claude.
#   review → ai:needs-changes → fixup → ai:needs-review → review → ... bis 🟢
#
# CONCURRENCY: Statische Gruppe pro Phase (globale Serialisierung, FIFO). Der `precheck`-Job
# (im Callee) prüft den LABEL-IST-ZUSTAND zur LAUFZEIT — queued Runs würden mit dem Label-
# Zustand zum TRIGGER-Zeitpunkt falsch wiederholen.

on:
  pull_request:
    types: [labeled]

concurrency:
  group: claude-pr-fixup
  cancel-in-progress: false
  # queue: max — OHNE dies hält GitHub pro Gruppe nur EINEN pending-Run: jeder neue
  # Run cancelt den wartenden (`queue: single` ist der Default). Mit statischem,
  # ticket-unabhängigem Key hätte ein Label-Burst über mehrere Tickets die
  # wartenden Läufe still verworfen — Trigger-Label klebt, kein Lauf, kein Notice.
  # `max` = bis zu 100 pending, FIFO. Unvereinbar mit cancel-in-progress: true.
  queue: max

permissions:
  contents: read
  id-token: write
  actions: write
  pull-requests: write

jobs:
  fixup:
    # Unveränderliche Event-Fakten filtern hier — inkl. des FORK-GUARDS. Der ist an dieser
    # Stelle sicherheitsrelevant: der Callee checkt den PR-Head-Ref, also PR-Code, aus und
    # führt Actions/Skripte daraus aus. Stünde der Guard erst am Callee-Hauptjob, führte ein
    # Fork-PR mit manipuliertem check-phase-label.sh eigenen Bash aus, sobald irgendjemand
    # ein Label setzt. Vor dieser Umstellung gab es für Fork-PRs gar keinen Checkout in 05.
    if: >-
      ${{ github.event.label.name == 'ai:needs-changes' &&
      github.event.pull_request.head.repo.full_name == github.repository }}
    uses: deleonio/agent-pipeline/.github/workflows/fixup.yml@v1.0
    with:
      pr-number: ${{ github.event.pull_request.number }}
      head-ref: ${{ github.event.pull_request.head.ref }}
      node-version-file: .nvmrc
      install-command: 'corepack enable && pnpm install --frozen-lockfile && pnpm exec lefthook install'
    secrets:
      APP_ID: ${{ secrets.APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
      ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
      CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
