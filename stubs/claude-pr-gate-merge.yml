name: Claude PR Gate & Auto-Merge

# ⚠️ VERTRAG: Dateiname + name sind load-bearing (gate-merge-Allowlist ['CI','5/7 Review'],
# Sweep dispatcht '07-claude-pr-documenter.yml' per Dateiname, pr-cancel iteriert Dateinamen) — NICHT umbenennen.
# generated by agent-pipeline@v1.0 — Änderungen nur via init.sh / Re-Pin, nicht von Hand.
#
# Stub: Trigger + Event-/Fork-if + Concurrency. Der gesamte Ablauf (App-Token-Preflight,
# PR-Aufloesung, Allowlist-Auswertung, Gate/Merge) liegt im Callee
# .github/workflows/gate-merge.yml (deleonio/agent-pipeline@v1.0).
#
# HINWEIS (workflow_run): Dieser Trigger wird ausschliesslich aus dem DEFAULT-BRANCH (main) gelesen.
# Gate/Auto-Merge werden daher erst AKTIV, nachdem diese Datei nach main gemergt ist — sie laufen
# NICHT auf dem eigenen PR dieses Tickets. Validierung ist erst nach dem Merge moeglich (am naechsten PR).

on:
  workflow_run:
    # Allowlist: NUR diese beiden Workflows gaten/wecken. Externe Checks (z. B. Renovate) zaehlen
    # bewusst nicht mit. Die Namen muessen exakt den `name:`-Feldern der Konsumenten-Workflows
    # entsprechen — STUB-NAMEN-VERTRAG: dieser on-Filter bleibt fix (Namen sind load-bearing,
    # s. Dateikopf); die Callee-seitige Auswertung in `gh pr checks` parametrisieren die Inputs
    # ci-workflow-name / review-workflow-name.
    workflows: ['CI', '5/7 Review']
    types: [completed]
  pull_request:
    # ai:ready-to-merge wird gesetzt (CI evtl. schon gruen). Auf den Label-Namen wird im job-if
    # gefiltert, damit nicht jedes Label den Lauf startet.
    types: [labeled]

concurrency:
  # Pro PR serialisieren (head_branch identifiziert den PR ueber workflow_run hinweg; beim
  # labeled-Event die PR-Nummer), damit zwei kurz nacheinander eintreffende Events nicht doppelt
  # labeln/mergen.
  group: claude-pr-gatemerge-${{ github.event.workflow_run.head_branch || github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  # Union der Quell-Job-Permissions — der Callee-Gate/Merge-Job braucht sie; er arbeitet
  # ansonsten ueber das App-Token (Details/Kommentare im Callee).
  contents: read # Label/Merge laufen ueber das App-Token
  pull-requests: write
  issues: write

jobs:
  gate-merge:
    # Nur same-repo-Laeufe (kein Fork -> App-Token verfuegbar). Beim workflow_run zusaetzlich
    # main-Push-Laeufe ausschliessen: ein Merge pusht nach main -> CI-on-main -> wuerde sonst hier
    # einen No-op-Lauf fuer einen PR wecken, den es nicht gibt. Beim labeled-Event nur reagieren,
    # wenn wirklich ai:ready-to-merge gesetzt wurde. (Quell-job-if 1:1 — im Stub ist
    # github.event_name noch das ECHTE Event; der Callee erhaelt es als Input event-kind.)
    if: >-
      ${{ (github.event_name == 'workflow_run'
      && github.event.workflow_run.head_repository.full_name == github.repository
      && github.event.workflow_run.head_branch != 'main')
      || (github.event_name == 'pull_request'
      && github.event.label.name == 'ai:ready-to-merge'
      && github.event.pull_request.head.repo.full_name == github.repository) }}
    uses: deleonio/agent-pipeline/.github/workflows/gate-merge.yml@v1.0
    with:
      # Event-Fakten aus dem echten Stub-Event ableiten (github.event_name entscheidet, welcher
      # Payload-Zweig die PR-Identitaet liefert).
      event-kind: ${{ github.event_name == 'workflow_run' && 'workflow_run' || 'pull_request' }}
      pr-number: ${{ github.event.pull_request.number || '' }}
      head-branch: ${{ github.event.workflow_run.head_branch || '' }}
    secrets:
      APP_ID: ${{ secrets.APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
      ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
      CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
