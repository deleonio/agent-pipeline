name: 4/7 Umsetzung

# ⚠️ VERTRAG: Dateiname + name sind load-bearing (Phasen-Verkettung/Doku der Pipeline,
# pr-cancel iteriert Dateinamen; Phasen-Namen stehen in Skripten/Allowlisten) — NICHT
# umbenennen.
# generated by agent-pipeline@v1.0 — Änderungen nur via init.sh / Re-Pin, nicht von Hand.

# Setzt ein Issue um, sobald es das Label "ai:ready" erhält UND bereits
# "ai:analyzed" trägt.
# Setzt **Claude Code** ein; Provider via `vars.LLM_PROVIDER` (zai|claude), aufgelöst in setup-claude.
#
# CONCURRENCY: Statische Gruppe pro Phase (globale Serialisierung, FIFO). Der `precheck`-Job
# (im Callee) prüft den LABEL-IST-ZUSTAND zur LAUFZEIT — queued Runs würden mit dem
# Label-Zustand zum TRIGGER-Zeitpunkt falsch wiederholen (Label inzwischen von einem anderen
# Lauf konsumiert). Ausnahme Continuation: Der Soft-Abort unten entfernt+re-addet ai:ready
# absichtlich — der Folgelauf sieht das Label dann (korrekt) noch vorhanden und setzt fort.

on:
  issues:
    types: [labeled]

concurrency:
  group: claude-implement
  cancel-in-progress: false
  # queue: max — OHNE dies hält GitHub pro Gruppe nur EINEN pending-Run: jeder neue
  # Run cancelt den wartenden (`queue: single` ist der Default). Mit statischem,
  # ticket-unabhängigem Key hätte ein Label-Burst über mehrere Tickets die
  # wartenden Läufe still verworfen — Trigger-Label klebt, kein Lauf, kein Notice.
  # `max` = bis zu 100 pending, FIFO. Unvereinbar mit cancel-in-progress: true.
  queue: max

permissions:
  contents: read
  issues: write
  id-token: write
  actions: write
  pull-requests: write

jobs:
  umsetzung:
    # Unveränderliches Event-Faktum filtert hier (spart den Runner für No-op-Trigger — die
    # Vorläufer-Phase feuert auf JEDES `labeled` im Repo): der Label-Filter wanderte aus dem
    # Callee-precheck-if in dieses Stub-job-if. Die LAUFZEIT-Prüfung (ai:ready + ai:analyzed
    # IST-Zustand nach dem Warten in der Queue) bleibt im Callee-precheck (check-phase-label).
    if: >-
      ${{ github.event.label.name == 'ai:ready' }}
    uses: deleonio/agent-pipeline/.github/workflows/implement.yml@v1.0
    with:
      issue-number: ${{ github.event.issue.number }}
      node-version-file: .nvmrc
      install-command: 'corepack enable && pnpm install --frozen-lockfile && pnpm exec lefthook install'
      verify-command: 'pnpm format && pnpm lint && pnpm test'
    secrets:
      APP_ID: ${{ secrets.APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
      ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
      CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
