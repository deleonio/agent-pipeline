# ⚠️ VERTRAG: Dateiname + name sind load-bearing (Allowlist '5/7 Review', Sweep-Dispatch
# '07-claude-pr-documenter.yml', pr-cancel iteriert Dateinamen) — NICHT umbenennen.
# generated by agent-pipeline@v1.0 — Änderungen nur via init.sh / Re-Pin, nicht von Hand.

name: 2/7 UX-Beratung

# UX-Beratung als automatisierte Phase VOR der Spec — beratend, nicht blockierend.
# Läuft als Phase 2 von 7, sequenziell nach der Analyse. Triggert auf ai:spec-ready,
# schreibt KI-UX-Block zwischen <!-- KI-UX:START --> und <!-- KI-UX:END --> in den
# Issue-Body und gibt über ux:ready an die Spec-Phase weiter. ai:spec-ready bleibt
# am Issue kleben — die Spec-Phase konsumiert es.
#
# CONCURRENCY: Statische Gruppe pro Phase (globale Serialisierung, FIFO).

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue-Nummer'
        required: true
        type: string

concurrency:
  group: claude-ux
  cancel-in-progress: false
  queue: max

permissions:
  contents: read
  issues: write
  id-token: write
  actions: write

jobs:
  ux:
    # [aus 02-claude-ux.yml precheck-if übernommen]
    # Bei workflow_dispatch immer laufen, sonst nur bei Label ai:spec-ready
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.label.name == 'ai:spec-ready' }}
    uses: deleonio/agent-pipeline/.github/workflows/ux.yml@v1.0
    with:
      issue-number: ${{ github.event.issue.number || github.event.inputs.issue_number }}
      node-version-file: .nvmrc
      install-command: 'corepack enable && pnpm install --frozen-lockfile && pnpm exec lefthook install'
    secrets:
      APP_ID: ${{ secrets.APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
      ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
      CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
