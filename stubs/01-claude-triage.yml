# ⚠️ VERTRAG: Dateiname + name sind load-bearing (Allowlist '5/7 Review', Sweep-Dispatch
# '07-claude-pr-documenter.yml', pr-cancel iteriert Dateinamen) — NICHT umbenennen.
# generated by agent-pipeline@v1.0 — Änderungen nur via init.sh / Re-Pin, nicht von Hand.

name: 1/7 Analyse

# Stößt die KI-Analyse (Triage) eines Issues automatisch an.
# Setzt **Claude Code** ein; Provider via `vars.LLM_PROVIDER` (zai|claude), aufgelöst in setup-claude.
#
# Triggert bei:
#  - neuem Issue (issues: opened)
#  - Entfernen von Label "ai:analyzed" oder "ai:to-big-issue" (issues: unlabeled) → Re-Triage
#
# BEWUSST KEIN issue_comment-Trigger: Der frühere @hermes-Mention-Trigger ist tot – die
# Konvention gibt es nicht mehr, und Kommentare (insbesondere Bot-Kommentare) dürfen nichts
# anstoßen.
# Re-Triage läuft über das Entfernen von `ai:analyzed`.
#
# CONCURRENCY: Statische Gruppe pro Phase (globale Serialisierung, FIFO) + cancel-in-progress:
# false. Ein Run, der hinterher im Pre-Check übersprungen wird, darf KEINESFALLS einen laufenden
# Run verdrängen — mit true würde JEDES Issue-Event den laufenden Triage-Lauf global canceln.
# Die frühere Dedup über den Suffix-Trick im Group-Key (Trigger-Bedingung als true/false-Anhang)
# übernimmt jetzt der `precheck`-Job (im Callee): Er prüft den LABEL-IST-ZUSTAND zur LAUFZEIT,
# weil queued Runs mit dem Label-Zustand zum TRIGGER-Zeitpunkt falsch wiederholen würden.

on:
  issues:
    types: [opened, unlabeled]

concurrency:
  group: claude-triage
  cancel-in-progress: false
  # queue: max — OHNE dies hält GitHub pro Gruppe nur EINEN pending-Run: jeder neue
  # Run cancelt den wartenden (`queue: single` ist der Default). Mit statischem,
  # ticket-unabhängigem Key hätte ein Label-Burst über mehrere Tickets die
  # wartenden Läufe still verworfen — Trigger-Label klebt, kein Lauf, kein Notice.
  # `max` = bis zu 100 pending, FIFO. Unvereinbar mit cancel-in-progress: true.
  queue: max

permissions:
  contents: read
  issues: write
  id-token: write
  pull-requests: write
  actions: write

jobs:
  triage:
    # [aus 01-claude-triage.yml precheck-if übernommen]
    # Unveränderliche Event-Fakten filtern hier (spart den Runner für No-op-Trigger — 01 feuert
    # auf JEDES `unlabeled` im Repo). Im Original gaten sie den precheck, nicht den Hauptjob:
    # wurde der precheck übersprungen, war sein Output leer und der Hauptjob fiel korrekt mit
    # aus. Als Stub-if sparen sie den kompletten Callee-Aufruf; die Laufzeit-Prüfung des
    # Label-IST-Zustands bleibt im Callee-precheck.
    if: >-
      ${{ (github.event.action == 'opened' && (github.event.issue.author_association == 'OWNER' || github.event.issue.author_association == 'MEMBER' || github.event.issue.author_association == 'COLLABORATOR')) || (github.event.action == 'unlabeled' && (github.event.label.name == 'ai:analyzed' || github.event.label.name == 'ai:to-big-issue')) }}
    uses: deleonio/agent-pipeline/.github/workflows/triage.yml@v1.0
    with:
      issue-number: ${{ github.event.issue.number }}
      trigger-label: ${{ github.event.label.name || '' }}
      skip-ux: false
    secrets:
      APP_ID: ${{ secrets.APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
      ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
      CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
