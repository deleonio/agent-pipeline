name: 6b Documenter Sweep

# ⚠️ VERTRAG: Dateiname + name sind load-bearing (gate-merge-Allowlist ['CI','5/7 Review'],
# Sweep dispatcht '07-claude-pr-documenter.yml' per Dateiname, pr-cancel iteriert Dateinamen) — NICHT umbenennen.
# generated by agent-pipeline@v1.0 — Änderungen nur via init.sh / Re-Pin, nicht von Hand.
#
# Stub: Trigger + Concurrency. Der gesamte Ablauf (Preflight, App-Token, Sweep) liegt im
# Callee .github/workflows/documenter-sweep.yml (deleonio/agent-pipeline@v1.0).

on:
  schedule:
    # Täglich 03:17 UTC — bewusst versetzt zu anderen Cron-Workflows (CodeQL, Cache-Cleanup),
    # damit Runner-/API-Last nicht gebündelt auftritt.
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Nur auflisten, nichts nachtriggern (Erst-Beobachtung eines frisch deployten Sweeps)'
        required: false
        type: boolean
        default: false

concurrency:
  group: documenter-sweep
  cancel-in-progress: false
  # queue: max — konsistent mit den Phasen-Workflows: ein gestapelter Sweep darf den
  # wartenden nicht still verwerfen (er hat evtl. bereits Kandidaten gefunden).
  queue: max

permissions:
  # Union der Quell-Job-Permissions (Quelle hatte nur top-level Permissions):
  contents: read # Repo-Kontext für gh-Suche
  actions: write # workflow_dispatch auf Phase 7 (via App-Token)
  pull-requests: read

jobs:
  call-sweep:
    uses: deleonio/agent-pipeline/.github/workflows/documenter-sweep.yml@v1.0
    with:
      # github.event.inputs.dry-run == 'true': bei schedule fehlt der Dispatch-Input
      # (leerer String ≠ 'true' → false = Callee-Default); bei workflow_dispatch wird der
      # gesetzte Wert als boolean durchgereicht.
      dry-run: ${{ github.event.inputs.dry-run == 'true' }}
    secrets:
      APP_ID: ${{ secrets.APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
      ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
      CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
