name: 7/7 Dokumentation

# ⚠️ VERTRAG: Dateiname + name sind load-bearing (gate-merge-Allowlist ['CI','5/7 Review'],
# Sweep dispatcht '07-claude-pr-documenter.yml' per Dateiname, pr-cancel iteriert Dateinamen) — NICHT umbenennen.
# generated by agent-pipeline@v1.0 — Änderungen nur via init.sh / Re-Pin, nicht von Hand.
#
# Stub: Trigger + Event-Fakten-Filter + Concurrency. Der gesamte Ablauf liegt im Callee
# .github/workflows/documenter.yml (deleonio/agent-pipeline@v1.0).

on:
  # Trigger an den ECHTEN Merge koppeln (Issue #496): `pull_request: [closed]` feuert pro
  # geschlossenem PR genau einmal; der Job-Guard (`if: ... merged == true`) schaltet die
  # Schliessen-ohne-Merge-Closes aus. Damit entfaellt das Over-Triggering des frueheren
  # `workflow_run`-Triggers, der bei JEDEM Abschluss des Gate-Workflows (meist No-op) feuerte.
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      pr-number:
        description: 'PR-Nummer für manuellen Catch-up (z. B. liegengebliebener, gemergter PR)'
        required: true
        type: string

concurrency:
  # Statische Gruppe pro Phase (globale Serialisierung, FIFO): jede Phase hat genau eine
  # Laufzeit-Instanz. Der precheck-Job (im Callee) verhindert falsches Nachziehen — kurz
  # hintereinander gemergte PRs reihen sich ein statt zu parallelisieren.
  group: claude-pr-documenter
  cancel-in-progress: false
  # queue: max — OHNE dies hält GitHub pro Gruppe nur EINEN pending-Run: jeder neue
  # Run cancelt den wartenden (`queue: single` ist der Default). Mit statischem,
  # ticket-unabhängigem Key hätte ein Merge-Burst die wartenden Läufe still
  # verworfen — PR bliebe undokumentiert, kein Notice.
  # `max` = bis zu 100 pending, FIFO. Unvereinbar mit cancel-in-progress: true.
  queue: max

permissions:
  # Union der Quell-Job-Permissions — der Callee braucht sie für PR-/Issue-/Label-/Artefakt-
  # Schreibzugriffe und den App-Token-Mint (id-token); Details/Kommentare im Callee.
  contents: read # Claude ändert PR-Metadaten via gh, nicht den Repo-Inhalt — kein Commit mehr.
  pull-requests: write
  issues: write
  # actions: write — fuer das Loeschen der Memory-Artefakte beim Issue-Memory-Abbau.
  actions: write
  # id-token: write — App-Token (setup-claude).
  id-token: write

jobs:
  call-documenter:
    # Unveränderliche Event-Fakten filtern hier (merged ist nach dem Schliessen unveränderlich);
    # der workflow_dispatch-Catch-up-Pfad bleibt offen. Die LAUFZEITprüfungen (PR IST noch
    # gemergt, noch kein ai:documented — fail-closed) macht der precheck-Job im Callee.
    if: >-
      ${{ github.event.pull_request.merged == true || github.event_name == 'workflow_dispatch' }}
    uses: deleonio/agent-pipeline/.github/workflows/documenter.yml@v1.0
    with:
      # Beide Trigger-Pfade münden in einer PR-Nummer: merged-close-Event liefert sie direkt,
      # dispatch über den gleichnamigen Input.
      pr-number: ${{ github.event.pull_request.number || github.event.inputs.pr-number }}
    secrets:
      APP_ID: ${{ secrets.APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
      ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
      CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
