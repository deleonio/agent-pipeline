# ⚠️ VERTRAG: Dateiname + name sind load-bearing (Allowlist '5/7 Review', Sweep-Dispatch
# '07-claude-pr-documenter.yml', pr-cancel iteriert Dateinamen) — NICHT umbenennen.
# generated by agent-pipeline@v1.0 — Änderungen nur via init.sh / Re-Pin, nicht von Hand.

name: 3/7 Spec

# Schreibt die ROTEN Tests (ausführbarer Vertrag) für ein Issue, sobald es
# das Label "ux:ready" erhält (gesetzt von der UX-Phase bei UI-Tickets oder
# direkt von der Triage bei Nicht-UI-Tickets) UND bereits "ai:spec-ready" und
# "ai:analyzed" trägt.
# Setzt **Claude Code** ein; Provider via `vars.LLM_PROVIDER` (zai|claude), aufgelöst in setup-claude.
#
# CONCURRENCY: Statische Gruppe pro Phase (globale Serialisierung, FIFO). Der `precheck`-Job
# (im Callee) prüft den LABEL-IST-ZUSTAND zur LAUFZEIT — queued Runs würden mit dem
# Label-Zustand zum TRIGGER-Zeitpunkt falsch wiederholen (Label inzwischen von einem anderen
# Lauf konsumiert).

on:
  issues:
    types: [labeled]

concurrency:
  group: claude-spec
  cancel-in-progress: false
  # queue: max — OHNE dies hält GitHub pro Gruppe nur EINEN pending-Run: jeder neue
  # Run cancelt den wartenden (`queue: single` ist der Default). Mit statischem,
  # ticket-unabhängigem Key hätte ein Label-Burst über mehrere Tickets die
  # wartenden Läufe still verworfen — Trigger-Label klebt, kein Lauf, kein Notice.
  # `max` = bis zu 100 pending, FIFO. Unvereinbar mit cancel-in-progress: true.
  queue: max

permissions:
  contents: read
  id-token: write
  actions: write
  pull-requests: write
  issues: write

jobs:
  spec:
    # [aus 03-claude-spec.yml precheck-if übernommen]
    # Unveränderliches Event-Faktum filtert hier (spart den Runner für No-op-Trigger — 02 feuert
    # auf JEDES `labeled` im Repo). Im Original gatete es den precheck, nicht den Hauptjob:
    # wurde der precheck übersprungen, war sein Output leer und der Hauptjob fiel korrekt mit
    # aus. Als Stub-if spart es den kompletten Callee-Aufruf; die Laufzeit-Prüfung des
    # Label-IST-Zustands bleibt im Callee-precheck.
    if: ${{ github.event.label.name == 'ux:ready' }}
    uses: deleonio/agent-pipeline/.github/workflows/spec.yml@v1.0
    with:
      issue-number: ${{ github.event.issue.number }}
      node-version-file: .nvmrc
      install-command: 'corepack enable && pnpm install --frozen-lockfile && pnpm exec lefthoop install'
      test-paths: 'server/src frontend/src frontend/e2e'
    secrets:
      APP_ID: ${{ secrets.APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
      ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
      CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
